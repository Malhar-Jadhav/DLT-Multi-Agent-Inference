# Ablation configurations for the debate system (GSM8K, 200 tasks, seeds 0/1/2).
# Each entry is one row of the 10-config ablation matrix.
# l1_parallel: asyncio.gather on independent solver calls
# l2_coalesce: identical-prompt calls merged into one n= request
# l3_cache:    vLLM prefix caching on (server must be started with --enable-prefix-caching)
# l4_tier:     low-stakes roles use qwen3-1.7b instead of qwen3-14b

system: debate
dataset: gsm8k
split: eval
seeds: [0, 1, 2]
large_model: qwen3-14b
small_model: qwen3-1.7b

configs:
  - name: C0
    description: "Baseline: all levers off, sequential, large model only, no caching"
    l1_parallel: false
    l2_coalesce: false
    l3_cache: false
    l4_tier: false

  - name: C1
    description: "Add-one: parallel dispatch only"
    l1_parallel: true
    l2_coalesce: false
    l3_cache: false
    l4_tier: false

  - name: C2
    description: "Add-one: request coalescing only"
    l1_parallel: false
    l2_coalesce: true
    l3_cache: false
    l4_tier: false

  - name: C3
    description: "Add-one: prefix caching only"
    l1_parallel: false
    l2_coalesce: false
    l3_cache: true
    l4_tier: false

  - name: C4
    description: "Add-one: model tiering only"
    l1_parallel: false
    l2_coalesce: false
    l3_cache: false
    l4_tier: true

  - name: C5
    description: "All levers on"
    l1_parallel: true
    l2_coalesce: true
    l3_cache: true
    l4_tier: true

  - name: C6
    description: "Leave-one-out: all minus L1 (parallel dispatch)"
    l1_parallel: false
    l2_coalesce: true
    l3_cache: true
    l4_tier: true

  - name: C7
    description: "Leave-one-out: all minus L2 (request coalescing)"
    l1_parallel: true
    l2_coalesce: false
    l3_cache: true
    l4_tier: true

  - name: C8
    description: "Leave-one-out: all minus L3 (prefix caching)"
    l1_parallel: true
    l2_coalesce: true
    l3_cache: false
    l4_tier: true

  - name: C9
    description: "Leave-one-out: all minus L4 (model tiering)"
    l1_parallel: true
    l2_coalesce: true
    l3_cache: true
    l4_tier: false
